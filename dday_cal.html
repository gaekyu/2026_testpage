    <main>
      <section>
        <h2> Date 객체 활용 : D-day 계산기</h2>
        <script>
          // 현재 날짜 객체 생성
          let now = new Date();

          // 목표 날짜 입력
          let year = prompt("목표 연도를 입력하세요. (예:2027)", "2027");
          let month = prompt("목표 월을 입력하세요. (1~12)", "1");
          let day = prompt("목표 일을 입력하세요. (1~31)", "1");

          // 입력 X (혹은 취소)
          if (!year || !month || !day) {
            document.write("<h3>계산을 취소합니다</h3>");
          } else {
            let y = Number(year);
            let m = Number(month);
            let d = Number(day);

            // 목표 날짜 객체 생성 (하나만 사용)
            let dDate = new Date(y, m - 1, d);

            // 1) 숫자가 맞는지, 유효한 날짜인지 확인
            if (isNaN(dDate.getTime())) {
              document.write("<h3>올바른 숫자를 입력해주세요.</h3>");
            }
            // 2) 2월 31일처럼 자동 보정된 날짜인지 확인
            else if (dDate.getFullYear() !== y ||
              dDate.getMonth() !== m - 1 ||
              dDate.getDate() !== d) {
              document.write("<h3>존재하지 않는 날짜입니다.</h3>");
            }
            // 3) 정상 → 계산 및 출력
            else {
              let diffMs = dDate.getTime() - now.getTime();
              let diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

              document.write("<h3>목표 날짜 : " + dDate.toLocaleDateString() + "</h3>");

              if (diffDay === 0) {
                document.write("<h3>🎉🎉🎉 D-day 🎉🎉🎉</h3>");
              } else if (diffDay > 0) {
                document.write("<h3>D-" + diffDay + "</h3>");
              } else {
                // 음수인 diffDay 절대값 변환 (D+-24 방지)
                document.write("<h3>D+" + Math.abs(diffDay) + "</h3>");
              }

              // 오늘 날짜 출력 및 새로고침 안내
              document.write("<hr>");
              document.write("<p>오늘 날짜 : " + now.toLocaleDateString() + "</p>");
              document.write("<p><i>새로고침(F5)를 눌러 다시 계산할 수 있습니다.</i></p>");
              document.write("<hr>");
            }
          }
        </script>
      </section>
